name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Types, unit tests and bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `build` runs svelte-check, builds, and fails if the initial payload
      # outgrows its budget.
      - run: pnpm build

      - run: pnpm test

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Only Chromium: the suite tests this app's behaviour, not cross-browser
      # rendering, and the service-worker paths need a Chromium-class engine.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm exec playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
