name: Release

# Releases are cut by tagging: bump `version` in package.json, commit, then push
# a matching `v*` tag. The tag is the only trigger, so day-to-day commits never
# spend twenty minutes compiling Rust.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  prepare:
    name: Draft the release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Catches the mistake that would otherwise ship an installer whose own
      # version disagrees with the tag people downloaded it from.
      - id: check
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not match package.json version $version."
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      # The draft is created once, here, rather than by whichever build job wins
      # the race: GitHub happily keeps several drafts on the same tag, and three
      # platforms starting at once is exactly how that happens.
      # The release id comes from the create response itself, never from
      # re-listing drafts: the REST releases list does not reliably include a
      # draft the instant it is created, and tauri-action only uploads when
      # `releaseId` is a valid number. Taking `data.id` straight from the
      # create call sidesteps that race entirely.
      - id: draft
        env:
          TAG: ${{ steps.check.outputs.tag }}
          VERSION: ${{ steps.check.outputs.version }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo

            const existingId = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 },
            ).then((releases) =>
              releases.find((r) => r.tag_name === process.env.TAG)?.id,
            )

            let id = existingId
            if (!id) {
              const { data } = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: process.env.TAG,
                name: `Noter ${process.env.VERSION}`,
                draft: true,
                body: [
                  'The same app as the website, installed on your device. Notes stay on the',
                  'machine you write them on; nothing is uploaded anywhere.',
                  '',
                  '| Platform | File |',
                  '| --- | --- |',
                  '| Windows | `.exe` (installer) or `.msi` |',
                  '| macOS | `.dmg` (Apple silicon and Intel) |',
                  '| Linux | `.AppImage`, `.deb` or `.rpm` |',
                  '| Android | `.apk`, sideloaded |',
                  '',
                  'The desktop builds are not code-signed. Windows shows a SmartScreen',
                  'warning - "More info" then "Run anyway" - and macOS wants the app opened',
                  'from its right-click menu the first time.',
                ].join('\n'),
              })
              id = data.id
            }

            core.setOutput('release_id', String(id))

  desktop:
    name: ${{ matrix.label }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest supported runner on purpose: glibc is forwards
          # compatible, not backwards, so a binary linked on 24.04 refuses to
          # start on anything older.
          - { os: ubuntu-22.04, label: Linux, args: '' }
          - { os: windows-latest, label: Windows, args: '' }
          # One universal binary rather than two downloads to choose between.
          - { os: macos-latest, label: macOS, args: '--target universal-apple-darwin' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            build-essential \
            file

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Compiling the dependency tree takes minutes; the cache turns a re-run of
      # the same tag into a link step.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # In-app updates. The updater only installs downloads signed with the
      # key whose public half is baked into the app, so both halves must be
      # configured: the private key as a secret, the public key as a variable
      # (see docs/updates.md). Without them the build is exactly as before and
      # the app falls back to pointing at the release page.
      - name: Configure the updater
        id: updater
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ -n "$PRIVATE_KEY" ] && [ -n "$PUBKEY" ]; then
            node -e 'require("fs").writeFileSync("updater.conf.json", JSON.stringify({ bundle: { createUpdaterArtifacts: true }, plugins: { updater: { pubkey: process.env.PUBKEY } } }))'
            echo "args=--config updater.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Updater signing is not configured; building without update artefacts."
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }} ${{ steps.updater.outputs.args }}

      # The Microsoft Store package. Unsigned on purpose: the Store signs it.
      # Skipped until the Partner Center identity is stored as repo variables.
      - name: Pack MSIX for the Microsoft Store
        if: matrix.os == 'windows-latest' && vars.MSIX_IDENTITY_NAME != ''
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: ./scripts/build-msix.ps1

      - name: Upload MSIX to the release
        if: matrix.os == 'windows-latest' && vars.MSIX_IDENTITY_NAME != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.prepare.outputs.tag }}" "$env:MSIX_PATH" --clobber

  android:
    name: Android
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      # An Android package can only be installed over a previous one when both
      # were signed with the same key, so a throwaway key is worse than none: it
      # would strand everyone who installed the last release. Without a key
      # configured the job says so and stops, rather than shipping something
      # nobody can upgrade.
      - id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; skipping the Android build. See README."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        if: steps.signing.outputs.configured == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.signing.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.signing.outputs.configured == 'true'

      - name: Build the web assets into the shell
        if: steps.signing.outputs.configured == 'true'
        run: pnpm android:sync

      - name: Restore the signing key
        if: steps.signing.outputs.configured == 'true'
        run: printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/noter.keystore"

      # The APK is what people sideload from the release page; the AAB is the
      # format a Play Store upload needs, and costs nothing to produce here.
      - name: Assemble
        if: steps.signing.outputs.configured == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/noter.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Upload to the draft release
        if: steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "noter-$VERSION.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "noter-$VERSION.aab"
          gh release upload "$TAG" "noter-$VERSION.apk" "noter-$VERSION.aab" --clobber

  publish:
    name: Publish
    needs: [prepare, desktop, android]
    runs-on: ubuntu-latest
    steps:
      # Only now, with every artefact attached, does the release stop being a
      # draft and become the one the website's download links point at.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ needs.prepare.outputs.tag }}" --draft=false --latest

  store:
    name: Microsoft Store
    needs: [prepare, publish]
    runs-on: windows-latest
    steps:
      # Submitting needs a Partner Center API client (see docs/microsoft-store.md).
      # Without one the job says so and succeeds, and the .msix on the release
      # can still be uploaded by hand.
      - id: creds
        shell: pwsh
        env:
          TENANT: ${{ secrets.MS_STORE_TENANT_ID }}
          CLIENT: ${{ secrets.MS_STORE_CLIENT_ID }}
          SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          SELLER: ${{ secrets.MS_STORE_SELLER_ID }}
          PRODUCT: ${{ vars.MS_STORE_PRODUCT_ID }}
        run: |
          if ($env:TENANT -and $env:CLIENT -and $env:SECRET -and $env:SELLER -and $env:PRODUCT) {
            "configured=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Output "::notice::Microsoft Store submission is not configured; skipping. See docs/microsoft-store.md."
            "configured=false" >> $env:GITHUB_OUTPUT
          }

      - name: Fetch the MSIX from the release
        if: steps.creds.outputs.configured == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "${{ needs.prepare.outputs.tag }}" --pattern '*.msix' --dir msix
          $file = Get-ChildItem msix -Filter *.msix | Select-Object -First 1
          if (-not $file) { throw 'The release has no .msix (are the MSIX_* variables set?).' }
          "MSIX=$($file.FullName)" >> $env:GITHUB_ENV

      - uses: microsoft/microsoft-store-apppublisher@v1.4
        if: steps.creds.outputs.configured == 'true'

      - name: Submit to the Store
        if: steps.creds.outputs.configured == 'true'
        shell: pwsh
        env:
          TENANT: ${{ secrets.MS_STORE_TENANT_ID }}
          CLIENT: ${{ secrets.MS_STORE_CLIENT_ID }}
          SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          SELLER: ${{ secrets.MS_STORE_SELLER_ID }}
          PRODUCT: ${{ vars.MS_STORE_PRODUCT_ID }}
        run: |
          msstore reconfigure --tenantId $env:TENANT --sellerId $env:SELLER --clientId $env:CLIENT --clientSecret $env:SECRET
          # Creates a submission with the new package and commits it for
          # certification; the listing, screenshots and pricing carry over.
          msstore publish "$env:MSIX" --appId $env:PRODUCT
