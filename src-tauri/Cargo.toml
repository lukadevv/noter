[package]
name = "noter"
version = "1.0.0"
description = "A local-first note-taking app"
authors = ["lukadevv"]
edition = "2021"
rust-version = "1.77.2"

# The desktop entry point is a thin `main.rs` over this library so the crate can
# also be built as a shared object, which is how mobile targets would consume it.
[lib]
name = "noter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
base64 = "0.22"
# Needed by generate_context! once tauri.conf.json configures a plugin.
serde_json = "1"

# Self-updating only exists on the desktop: Android installs come from an APK
# or a store, which update themselves.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
